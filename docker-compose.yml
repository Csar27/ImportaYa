services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ImportaYa_Sa_12345!}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__Default: "Server=sqlserver;Database=ImportaYa;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ImportaYa_Sa_12345!};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Key: ${JWT_KEY:-importaya-development-key-change-me-1234567890}
      Jwt__Issuer: ImportaYa
      Jwt__Audience: ImportaYa.Client
      AdminSeed__Email: ${ADMIN_EMAIL:-admin@demo.com}
      AdminSeed__Password: ${ADMIN_PASSWORD:-Admin12345}
      AdminSeed__DisplayName: Administrador
      Cors__AllowedOrigins__0: http://localhost:4200
      Cors__AllowedOrigins__1: http://127.0.0.1:4200
    ports:
      - "5080:5080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    environment:
      API_URL: ${API_URL:-http://localhost:5080/api}
    ports:
      - "4200:80"

volumes:
  sql-data:
